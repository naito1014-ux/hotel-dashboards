   note:'良し悪しの手がかりが無い文だけ（集計から外している分）'},
];

// クチコミ1件の区分を決める
function rvCommentCat(c) {
  const ss = c.sentences || [];
  const g = ss.some(function(x) { return x.polarity === 'good'; });
  const b = ss.some(function(x) { return x.polarity === 'bad'; });
  if (g && b) return 'both';
  if (g) return 'good';
  if (b) return 'bad';
  return 'none';
}

// 本文を文ごとに色分けして描く。記号と左罫でも区別できるようにする
function rvBodyHtml(c) {
  const ss = c.sentences || [];
  if (!ss.length) {
    // 分類前のレコード。本文をそのまま出す（色も記号も付けない）
    return '<div class="rv-sent rv-sent--neutral">'
         + '<span class="rv-sent-mark">・</span><span>' + esc(c.body || '') + '</span></div>';
  }
  return ss.map(function(x) {
    const pol = x.polarity === 'good' ? 'good' : (x.polarity === 'bad' ? 'bad' : 'neutral');
    const mark = pol === 'good' ? '＋' : (pol === 'bad' ? '−' : '・');
    const title = (x.topic || '') + ' / ' + pol;
    return '<div class="rv-sent rv-sent--' + pol + '" title="' + esc(title) + '">'
         + '<span class="rv-sent-mark" aria-hidden="true">' + mark + '</span>'
         + '<span><span class="sr-only">' + pol + '：</span>' + esc(x.text || '') + '</span>'
         + '</div>';
  }).join('');
}

function rvData() {
  return DATA.reviews || { months:[], otas:[], axes_by_ota:{}, by_month:{},
                           partial_month:null, cumulative:{}, comments:{},
                           sentences:{}, others:{} };
}
function rvCell(v) {
  // 欠測は空欄。0 を出さない（0点が付いたのと区別がつかなくなる）
  return (v === null || v === undefined) ? '' : v.toFixed(2);
}
// 生の軸名の候補（表記ゆれ）から、データにある方を拾う
function rvPick(axes, names) {
  if (!axes) return undefined;
  for (let i = 0; i < names.length; i++) if (axes[names[i]] !== undefined) return axes[names[i]];
  return undefined;
}
function rvPickPlain(axes, names) {
  if (!axes) return undefined;
  for (let i = 0; i < names.length; i++) if (axes[names[i]] !== undefined) return axes[names[i]];
  return undefined;
}
function rvN(n, count) {
  // 有効件数がその月の件数より少ないときだけ添える。
  // 全件に点が付いていれば n を出しても情報が増えない
  if (n == null || count == null || n >= count) return '';
  return '<span style="font-size:9px;color:var(--wn)"> n=' + n + '</span>';
}
// 選択月を最新とする13ヶ月を、古い順に返す
function rvRowMonths(latest) {
  if (!latest) return [];
  const y = Number(latest.slice(0, 4)), m = Number(latest.slice(5, 7));
  const out = [];
  for (let i = RV_MONTHS_SHOWN - 1; i >= 0; i--) {
    const t = y * 12 + (m - 1) - i;
    out.push(String(Math.floor(t / 12)).padStart(4, '0') + '-'
             + String(t % 12 + 1).padStart(2, '0'));
  }
  return out;
}
// 表示するOTA（RV_COLS の順。config にあるものだけ）
function rvShownOtas() {
  const have = rvData().otas || [];
  return Object.keys(RV_COLS).filter(function(o) { return have.indexOf(o) >= 0; });
}
// OTA×軸の2段ヘッダ。先頭列は必ず「件数」「総合」
function rvHeader(otas, extraFirst) {
  let h = '<tr><th rowspan="2" style="text-align:left">年月</th>';
  otas.forEach(function(o, i) {
    const n = RV_COLS[o].axes.length + 2;      // 件数 + 総合 + 軸
    h += '<th colspan="' + n + '" class="' + (i ? 'rv-ota-sep' : '')
       + '" style="color:' + (LR_OTA_COLOR[o] || 'var(--mu)') + '">'
       + RV_COLS[o].label + '</th>';
  });
  h += '</tr><tr>';
  otas.forEach(function(o, i) {
    h += '<th class="' + (i ? 'rv-ota-sep' : '') + '" style="font-size:10px">件数</th>';
    h += '<th style="font-size:10px">総合</th>';
    RV_COLS[o].axes.forEach(function(pair) {
      h += '<th style="font-size:10px;font-weight:400">' + pair[1] + '</th>';
    });
  });
  return h + '</tr>';
}

function drawReviews() {
  const RV = rvData();
  const tblM = document.getElementById('t-rv-monthly');
  if (!tblM) return;                     // クチコミタブ自体を出していない施設

  const months = RV.months || [];
  if (months.indexOf(rvMonth) < 0) rvMonth = months.length ? months[months.length - 1] : null;

  const tabs = document.getElementById('rv-month-tabs');
  tabs.innerHTML = months.map(function(m) {
    return '<button class="metric-btn' + (rvMonth === m ? ' active' : '')
      + '" data-rvmonth="' + m + '">' + m
      + (RV.partial_month === m ? '<span style="font-size:9px"> 途中</span>' : '')
      + '</button>'; }).join('');
  tabs.querySelectorAll('[data-rvmonth]').forEach(function(b) {
    b.onclick = function() { rvMonth = this.dataset.rvmonth; drawReviews(); };
  });

  const otas = rvShownOtas();
  const rows = rvRowMonths(rvMonth);

  // ── ブロック① 単月評価 ──
  let h = rvHeader(otas);
  rows.forEach(function(m) {
    const cur = (RV.by_month || {})[m] || {};
    const isSel = (m === rvMonth);
    h += '<tr' + (isSel ? ' style="background:rgba(139,105,20,0.10)"' : '') + '>'
       + '<td style="text-align:left;white-space:nowrap">' + m
       + (RV.partial_month === m ? '<span style="font-size:9px;color:var(--wn)"> 途中</span>' : '')
       + '</td>';
    otas.forEach(function(o, i) {
      const d = cur[o];
      const sep = i ? ' class="rv-ota-sep"' : '';
      h += '<td' + sep + '>' + (d ? (d.count == null ? '' : d.count) + rvSrcBadge(d.source) : '') + '</td>';
      h += '<td style="font-weight:600">' + (d ? rvCell(d.total) + rvN(d.total_n, d.count) : '') + '</td>';
      RV_COLS[o].axes.forEach(function(pair) {
        const a = d ? rvPick(d.axes, pair[0]) : undefined;
        h += '<td>' + (a ? rvCell(a.v) + rvN(a.n, d.count) : '') + '</td>';
      });
    });
    h += '</tr>';
  });
  tblM.innerHTML = h;

  // ── ブロック② ユーザー画面（累計） ──
  // 画面に出ているのは総合だけで、軸別の累計は一覧ページに無い。
  // 列は①と揃えたまま、軸の欄は空で置く（列がずれると読み比べられない）
  let c = rvHeader(otas);
  rows.forEach(function(m) {
    const cum = (RV.cumulative || {})[m] || {};
    const isSel = (m === rvMonth);
    c += '<tr' + (isSel ? ' style="background:rgba(139,105,20,0.10)"' : '') + '>'
       + '<td style="text-align:left;white-space:nowrap">' + m + '</td>';
    otas.forEach(function(o, i) {
      const v = cum[o];
      c += '<td' + (i ? ' class="rv-ota-sep"' : '') + '>'
         + (v ? (v.review_count != null ? v.review_count.toLocaleString() : '')
                + rvSrcBadge(v.source) : '') + '</td>';
      c += '<td style="font-weight:600">' + rvCell(v ? v.total : null) + '</td>';
      RV_COLS[o].axes.forEach(function(pair) {
        const x = v ? rvPickPlain(v.axes, pair[0]) : undefined;
        c += '<td>' + rvCell(x === undefined ? null : x) + '</td>';
      });
    });
    c += '</tr>';
  });
  document.getElementById('t-rv-cum').innerHTML = c;

  // ── ブロック③ Booking.com（10点満点）──
  // Booking の累計が1ヶ月も無ければブロックごと隠す。空表は「取得に失敗した」と
  // 誤読されるため。判定は「表示中の13ヶ月」ではなく **全期間** で見る。
  // 表示月を動かすたびにブロックが出たり消えたりすると、消えたのが
  // 「データが無い月」なのか「そもそも取っていない施設」なのか区別できない
  const rvHasBooking = Object.keys(RV.cumulative || {})
    .some(function(m) { return (RV.cumulative[m] || {}).booking; });
  const rvBkBlock = document.getElementById('rv-blk-booking');
  if (rvBkBlock) rvBkBlock.style.display = rvHasBooking ? '' : 'none';

  let b = '<tr><th style="text-align:left">年月</th>';
  RV_BOOKING_AXES.forEach(function(a) {
    b += '<th style="font-size:10px;font-weight:400">' + a[0] + '</th>'; });
  b += '<th style="font-size:10px;font-weight:400">件数</th></tr>';
  rows.forEach(function(m) {
    // Booking も review_summary に入っている（scale=10）
    const v = ((RV.cumulative || {})[m] || {}).booking;
    b += '<tr' + (m === rvMonth ? ' style="background:rgba(139,105,20,0.10)"' : '')
       + (v && v.source === 'manual' ? ' class="rv-manual"' : '') + '>'
       + '<td style="text-align:left;white-space:nowrap">' + m + rvSrcBadge(v && v.source) + '</td>';
    RV_BOOKING_AXES.forEach(function(a) {
      const x = a[0] === '総合' ? (v ? v.total : null)
                                : (v ? rvPickPlain(v.axes, a[1]) : undefined);
      b += '<td' + (a[0] === '総合' ? ' style="font-weight:600"' : '') + '>'
         + (x === null || x === undefined ? '' : Number(x).toFixed(1)) + '</td>';
    });
    // 件数は自動取得でしか取れない（Excelの③には件数の列が無い）。
    // 空欄は「0件」ではなく「その月は記録が無い」の意
    b += '<td>' + (v && v.review_count != null
                   ? Number(v.review_count).toLocaleString() : '') + '</td>';
    b += '</tr>';
  });
  document.getElementById('t-rv-booking').innerHTML = b;

  // ── 注記 ──
  document.getElementById('rv-note').innerHTML =
    '<div><strong style="color:var(--tx)">①</strong> その月に投稿されたクチコミの単純平均。'
    + '点が付いていない軸（画面の「-」）は母数から外し、'
    + '<span style="color:var(--wn)">n=</span> はその軸に点が付いた件数（月の件数より少ないときだけ表示）</div>'
    + '<div><strong style="color:var(--tx)">②</strong> 取得日時点でユーザー画面に出ている累計（全期間）。'
    + '件数はOTAが表示している累計クチコミ数で、①の月次件数とも一覧から辿れる件数とも一致しません</div>'
    // ③の注記も、ブロックを隠したときは一緒に消す。表が無いのに
    // 「③は10点満点で…」だけ残ると、読み手は無い表を探すことになる
    + (rvHasBooking
       ? '<div><strong style="color:var(--tx)">③</strong> Booking.com は<strong>10点満点</strong>で軸も違うため別表。'
         + '①②とは尺度が違うので数字を並べて比べないこと。'
         + '2026-08 から施設ページの累計を自動取得しています'
         + '<span style="color:var(--wn)">（個別クチコミはモーダルの中にあり自動では開けないため、'
         + '③には単月の平均もGood/Badも出ません）</span></div>'
       : '')
    + '<div style="margin-top:6px"><strong style="color:var(--tx)">出所</strong>：'
    + rvSrcBadge('manual') + ' 手作業Excel（月次会議資料からの転記。取得条件の記録が無い参考値）'
    + '　' + rvSrcBadge('public_page') + ' 自動取得（公開ページから収集）'
    + '<span style="color:var(--wn)">　'
    + '同じ月に両方あるときは自動取得を採用しています。'
    + '出所が変わる境目をまたいだ比較はできません（母数も取得条件も違います）</span></div>'
    + '<div><strong style="color:var(--tx)">一休/Yahoo（手作業）</strong>は、Excelで'
    + '一休とYahooが1列にまとまっており分離できない列です。'
    + '<strong>自動取得のYahooとは別系列</strong>なので、同じ列に混ぜていません</div>'
    + '<div>楽天の「食事※」はExcelの旧軸です。現行の朝食/夕食のどちらにも'
    + '対応しないため、寄せずに専用の列にしています</div>'
    + '<div style="margin-top:4px">列名はExcelに合わせています。'
    + '<strong>OTAごとに設問が違うため、同じ列名でも横並びで比較しないこと</strong>'
    + '（じゃらん「風呂」と楽天「温泉・お風呂」は別の設問）</div>'
    + (RV.partial_month
        ? '<div style="color:var(--wn)">※ ' + RV.partial_month
          + ' は実行日までの途中経過です。次回の取得で確定します</div>' : '')
    // 表示は RV_COLS の対応表を通すので、OTA側が軸名を変えると
    // その列が黙って消える。取れているのに出していない軸は必ず知らせる
    + (function() {
        const miss = [];
        otas.forEach(function(o) {
          const known = []; RV_COLS[o].axes.forEach(function(p) { p[0].forEach(function(x){ known.push(x); }); });
          (RV.axes_by_ota[o] || []).forEach(function(name) {
            if (known.indexOf(name) < 0) miss.push((RV_COLS[o].label) + '「' + name + '」');
          });
        });
        return miss.length
          ? '<div style="color:var(--wn)">※ 対応表に無い軸があり、表に出していません: '
            + miss.join(' / ') + '（RV_COLS に追加してください）</div>'
          : '';
      })();

  // ── 言及トピック（Good TOP10 / Bad TOP10）──
  // 選択月を最終月として、選んだ期間だけ遡って合計する。
  // 月ボタンとは独立に切り替わる（月を変えても期間は保つ）
  const spanTabs = document.getElementById('rv-top-tabs');
  spanTabs.innerHTML = RV_TOPIC_SPANS.map(function(n) {
    return '<button class="metric-btn' + (rvTopicSpan === n ? ' active' : '')
      + '" data-rvspan="' + n + '">' + n + 'ヶ月</button>'; }).join('');
  spanTabs.querySelectorAll('[data-rvspan]').forEach(function(b) {
    b.onclick = function() { rvTopicSpan = Number(this.dataset.rvspan); drawReviews(); };
  });

  const topWin = rvRowMonths(rvMonth).slice(-rvTopicSpan);
  const agg = {};
  let nGood = 0, nBad = 0, nNeutral = 0, nOther = 0, nOtherNeutral = 0;
  topWin.forEach(function(m) {
    const st = (RV.sentences || {})[m] || {};
    Object.keys(st).forEach(function(topic) {
      const v = st[topic];
      const a = agg[topic] || (agg[topic] = {good:0, bad:0, neutral:0});
      a.good += v.good || 0; a.bad += v.bad || 0; a.neutral += v.neutral || 0;
      nGood += v.good || 0; nBad += v.bad || 0; nNeutral += v.neutral || 0;
      if (topic === 'その他') {
        nOther += (v.good||0) + (v.bad||0) + (v.neutral||0);
        nOtherNeutral += v.neutral || 0;
      }
    });
  });

  // 「その他」は分類できなかった文なので、順位には混ぜない（別途件数で出す）
  function rankTable(key) {
    const rows = Object.keys(agg)
      .filter(function(t) { return t !== 'その他' && agg[t][key] > 0; })
      .sort(function(a, b) { return agg[b][key] - agg[a][key]; })
      .slice(0, 10);
    if (!rows.length) return '<tr><td class="empty-msg">該当なし</td></tr>';
    const max = agg[rows[0]][key];
    let h = '<tr><th style="width:28px">#</th><th style="text-align:left">トピック</th>'
          + '<th style="width:56px">件数</th><th></th></tr>';
    rows.forEach(function(t, i) {
      const n = agg[t][key];
      const col = key === 'good' ? '#2e7d32' : '#c62828';
      h += '<tr><td style="color:var(--mu)">' + (i + 1) + '</td>'
         + '<td style="text-align:left;white-space:nowrap">' + t + '</td>'
         + '<td style="font-weight:600">' + n + '</td>'
         + '<td style="width:100%"><div style="background:' + col
         + ';height:8px;border-radius:4px;width:' + (n / max * 100) + '%"></div></td></tr>';
    });
    return h;
  }
  document.getElementById('t-rv-good').innerHTML = rankTable('good');
  document.getElementById('t-rv-bad').innerHTML = rankTable('bad');

  // 期間に含まれる月のうち、実際にデータがある月。
  // 12ヶ月を選んでも収集が2ヶ月分しか無ければ「12ヶ月分」ではない。
  // そこを黙っていると、少ない母数を長期の傾向として読んでしまう
  const withData = topWin.filter(function(m) {
    const st = (RV.sentences || {})[m];
    return st && Object.keys(st).length; });

  const total = nGood + nBad + nNeutral;
  document.getElementById('rv-top-head').textContent =
    topWin.length
      ? '（' + topWin[0] + ' 〜 ' + topWin[topWin.length - 1] + '　' + topWin.length + 'ヶ月）'
      : '';
  document.getElementById('rv-top-note').innerHTML = total
    ? '<div><strong style="color:var(--tx)">集計範囲</strong>：'
      + topWin[0] + ' 〜 ' + topWin[topWin.length - 1] + '（' + topWin.length + 'ヶ月）'
      + (withData.length < topWin.length
          ? '<span style="color:var(--wn)"> ／ このうちデータがあるのは ' + withData.length
            + 'ヶ月（' + withData.join(', ') + '）。'
            + '残り ' + (topWin.length - withData.length) + 'ヶ月は未収集で、件数に入っていません</span>'
          : '')
      + '</div>'
      + '<div>クチコミを文に分けて、文ごとにトピックとGood/Badを判定した件数です'
      + '（1件のクチコミが複数のトピックに入ります）</div>'
      + '<div>判定の内訳： good ' + nGood + '件 / bad ' + nBad + '件 / '
      + '<strong style="color:var(--wn)">neutral ' + nNeutral + '件</strong>'
      + '（良し悪しの手がかりが無い文。集計から外しています）</div>'
      + '<div><strong style="color:var(--wn)">「その他」' + nOther + '件</strong>'
      + '（どのトピックにも当たらなかった文。うち neutral ' + nOtherNeutral + '件）。'
      + '順位には入れていません。ここが増えたらトピックの語を見直してください</div>'
      + '<div style="margin-top:4px">判定はキーワード規則です。'
      + '「もう宿泊することはない」のように手がかりの無い否定は neutral に落ちるため、'
      + '<strong>bad は実際より少なく出ます</strong></div>'
    : '<div>文単位の分類がまだありません（classify_reviews.py を実行してください）</div>';

  // ── コメント（選択月に投稿された本文）──
  const cmts = (RV.comments || {})[rvMonth] || [];
  document.getElementById('rv-cmt-head').textContent =
    rvMonth ? '（' + rvMonth + ' 投稿分 ' + cmts.length + '件）' : '';

  // ── OTAタブ ──
  // その月に実際にコメントがあるOTAだけ出す（0件のタブは押しても何も起きない）
  const cmtOtaCount = {};
  cmts.forEach(function(c) { cmtOtaCount[c.ota] = (cmtOtaCount[c.ota] || 0) + 1; });
  const cmtOtas = Object.keys(cmtOtaCount).sort(function(a, b) {
    return cmtOtaCount[b] - cmtOtaCount[a]; });
  if (rvCmtOta !== 'all' && cmtOtas.indexOf(rvCmtOta) < 0) rvCmtOta = 'all';

  const cmtTabs = document.getElementById('rv-cmt-tabs');
  cmtTabs.innerHTML =
    '<button class="metric-btn' + (rvCmtOta === 'all' ? ' active' : '')
    + '" data-cmtota="all">全OTA <span style="opacity:.7">' + cmts.length + '</span></button>'
    + cmtOtas.map(function(o) {
        return '<button class="metric-btn' + (rvCmtOta === o ? ' active' : '')
          + '" data-cmtota="' + o + '" style="border-left:3px solid '
          + (LR_OTA_COLOR[o] || 'var(--bd)') + '">'
          + (LR_OTA_NAME[o] || o) + ' <span style="opacity:.7">'
          + cmtOtaCount[o] + '</span></button>'; }).join('');
  cmtTabs.querySelectorAll('[data-cmtota]').forEach(function(b) {
    b.onclick = function() {
      rvCmtOta = this.dataset.cmtota;
      rvCmtOpen = false;            // OTAを変えたら畳み直す
      drawReviews();
    };
  });

  if (!cmts.length) {
    document.getElementById('rv-comments').innerHTML =
      '<div class="empty-msg">この月に投稿されたコメントはありません</div>';
    return;
  }

  // ── 絞り込みと件数の打ち切り ──
  const picked = rvCmtOta === 'all'
    ? cmts : cmts.filter(function(c) { return c.ota === rvCmtOta; });

  // 既定では **OTAごとに** 先頭 RV_CMT_INIT 件。投稿日の新しい順に並んでいるので
  // 先頭から取れば最新が残る。全体で切ると1社がタブを埋めてしまう
  let shown = picked, hidden = 0;
  if (!rvCmtOpen) {
    const perOta = {};
    shown = picked.filter(function(c) {
      perOta[c.ota] = (perOta[c.ota] || 0) + 1;
      return perOta[c.ota] <= RV_CMT_INIT;
    });
    hidden = picked.length - shown.length;
  }

  // 区分ごとにまとめる。判定なし（neutral のみ）は末尾に置く
  const groups = {good:[], bad:[], both:[], none:[]};
  shown.forEach(function(c) { groups[rvCommentCat(c)].push(c); });

  let out =
    '<div style="font-size:10px;color:var(--mu);line-height:1.9;margin-bottom:10px">'
    + '<div>本文は文ごとに判定を付けています。'
    + '<span class="rv-cat rv-cat--good">＋ Good</span> '
    + '<span class="rv-cat rv-cat--bad">− Bad</span> '
    + '<span class="rv-cat rv-cat--none">・ 判定なし</span>'
    + '　色だけでなく行頭の記号でも区別できます</div>'
    + '<div>区分はクチコミ単位（含まれる文から決定）。'
    + '判定なしは Good/Bad に寄せず末尾にまとめています</div>'
    + '<div>表示中：' + shown.length + '件 / ' + picked.length + '件'
    + (rvCmtOta === 'all' ? '（全OTA）' : '（' + (LR_OTA_NAME[rvCmtOta] || rvCmtOta) + '）')
    + (hidden ? '　既定はOTAごとに' + RV_CMT_INIT + '件までです' : '')
    + '</div>'
    + '</div>';

  RV_CATS.forEach(function(cat) {
    const list = groups[cat.key];
    if (!list.length) return;
    out += '<div class="rv-cmt-sec">'
        + '<span class="rv-cat ' + cat.cls + '">' + cat.mark + ' ' + cat.label + '</span>'
        + ' <span style="font-weight:400;color:var(--mu);font-size:10px">'
        + list.length + '件 — ' + cat.note + '</span></div>';
    out += list.map(function(x) {
      const col = LR_OTA_COLOR[x.ota] || 'var(--mu)';
      return '<div class="rv-cmt">'
        + '<div class="rv-cmt-meta">'
        + '<span class="rv-cat ' + cat.cls + '">' + cat.mark + ' ' + cat.label + '</span>'
        + '<span style="color:' + col + ';font-weight:600">'
        + (LR_OTA_NAME[x.ota] || x.ota) + '</span>'
        + '<span>' + (x.posted_at || '') + '</span>'
        + '<span>総合 ' + (x.total == null ? '–' : x.total) + '</span>'
        + (x.title ? '<span style="color:var(--tx)">' + esc(x.title) + '</span>' : '')
        + '</div>'
        + '<div class="rv-cmt-body">' + rvBodyHtml(x) + '</div>'
        + '</div>'; }).join('');
  });
  if (hidden) {
    out += '<div style="text-align:center;margin-top:10px">'
        + '<button class="metric-btn" id="rv-cmt-more">もっと見る（残り ' + hidden + '件）</button>'
        + '</div>';
  } else if (rvCmtOpen && picked.length > RV_CMT_INIT) {
    out += '<div style="text-align:center;margin-top:10px">'
        + '<button class="metric-btn" id="rv-cmt-less">折りたたむ</button></div>';
  }
  const box = document.getElementById('rv-comments');
  box.innerHTML = out;
  const more = document.getElementById('rv-cmt-more');
  if (more) more.onclick = function() { rvCmtOpen = true; drawReviews(); };
  const less = document.getElementById('rv-cmt-less');
  if (less) less.onclick = function() { rvCmtOpen = false; drawReviews(); };
}

function drawListingRank() {
  const LR = lrData();
  const media = lrMedia();
  const tbl = document.getElementById('t-listing-rank');
  if (!tbl) return;                       // 掲載順位タブ自体を出していない施設

  // ── 人数の切替 ──
  // 一覧表・OTA別グラフ・上位10施設のすべてがこの1つを見る。
  // 選択肢が1つしかない施設（旅館は2名のみ）ではボタンを出さない。
  // 押しても何も変わらないボタンは、あるだけで迷わせる
  // 既定は2名。旅館2施設が2名のみで運用してきた実績があり、ホテルでも
  // 2名は必ず取る。2名が無い施設では、存在する中の最小値に落とす
  const caps = lrCaps();
  if (caps.length && caps.indexOf(lrCap) < 0) {
    lrCap = caps.indexOf(2) >= 0 ? 2 : caps[0];
  }
  const capBar = document.getElementById('lr-cap-bar');
  if (capBar) {
    capBar.innerHTML = caps.length > 1
      ? '<div class="chart-box" style="padding:10px 14px;display:flex;align-items:center;gap:10px">'
        + '<span style="font-size:11px;color:var(--mu);white-space:nowrap">人数</span>'
        + '<div class="metric-tabs">'
        + caps.map(function(c) {
            return '<button class="metric-btn' + (lrCap === c ? ' active' : '')
              + '" data-lrcap="' + c + '">大人' + c + '名</button>'; }).join('')
        + '</div>'
        + '<span style="font-size:10px;color:var(--mu)">一覧表・グラフ・上位10施設のすべてに効きます</span>'
        + '</div>'
      : '';
    capBar.querySelectorAll('[data-lrcap]').forEach(function(b) {
      b.onclick = function() { lrCap = Number(this.dataset.lrcap); drawListingRank(); };
    });
  }

  // 年の既定は「データがある最後の年」
  const years = lrYears();
  if (years.length && years.indexOf(lrYear) < 0) lrYear = years[years.length - 1];
  const yearTabs = document.getElementById('lr-year-tabs');
  yearTabs.innerHTML = years.map(function(y) {
    return '<button class="metric-btn' + (lrYear === y ? ' active' : '')
      + '" data-lryear="' + y + '">' + y + '年</button>'; }).join('');
  yearTabs.querySelectorAll('[data-lryear]').forEach(function(b) {
    b.onclick = function() { lrYear = this.dataset.lryear; drawListingRank(); };
  });

  // 一覧表とOTA別グラフは選んだ年だけ。TOP10表は年をまたいで横に伸ばす
  const months = lrYearMonths();

  if (!media.length) {
    tbl.innerHTML = '<tr><td class="empty-msg">掲載順位は未収集です（--facility を指定して生成してください）</td></tr>';
    document.getElementById('lr-cond').innerHTML = '';
    document.getElementById('lr-charts').innerHTML = '';
    document.getElementById('t-listing-top').innerHTML = '';
    document.getElementById('lr-top-note').innerHTML = '';
    return;
  }

  // ── 掲載順位 一覧（最上位） ──
  // 前月差・前年差の数字は出さない。年切替で並べて目で見比べる方式にする
  let h = '<tr><th style="text-align:left;white-space:nowrap">月</th>';
  media.forEach(function(c) {
    const col = LR_OTA_COLOR[c.ota] || 'var(--mu)';
    h += '<th style="white-space:nowrap;color:' + col + '">'
       + (LR_OTA_NAME[c.ota] || c.ota)
       + '<br><span style="font-size:9px;font-weight:400">' + lrDevLabel(c.device) + '</span></th>';
  });
  h += '</tr>';
  if (!months.length) {
    h += '<tr><td class="empty-msg" colspan="' + (media.length + 1) + '">'
       + (lrYear ? lrYear + '年のデータはありません' : 'データなし') + '</td></tr>';
  }
  months.slice().reverse().forEach(function(m) {
    const ref = lrIsRef(m);
    h += '<tr><td style="white-space:nowrap">' + m
       + (ref ? '<br><span style="font-size:9px;color:var(--wn)" title="'
                + String(lrRefNote(m)).replace(/"/g, '') + '">参考値（手作業）</span>' : '')
       + '</td>';
    media.forEach(function(c) {
      const r = lrFind(m, c.ota, c.device, lrCap);
      if (!r) { h += '<td style="text-align:center;color:var(--mu)">未取得</td>'; return; }
      h += '<td style="text-align:center;white-space:nowrap;color:'
         + (r.status === 'ok' ? 'var(--tx)' : 'var(--mu)') + (ref ? ';opacity:.75' : '') + '">'
         + lrPos(r) + '</td>';
    });
    h += '</tr>';
  });
  tbl.innerHTML = h;

  // ── 取得条件 ──
  const latest = months.length ? months[months.length - 1] : null;
  if (latest) {
    const doc = lrDoc(latest), cond = doc.conditions || {};
    const areaLines = Object.keys(cond.search_area_by_ota || {}).map(function(o) {
      return (LR_OTA_NAME[o] || o) + '=' + cond.search_area_by_ota[o]; }).join(' ／ ');
    // 宿泊日は「表示中の人数のレコード」から取る。先頭レコード決め打ちだと、
    // 1名・2名が混在する施設で、選んでいない方の条件を表示してしまう
    const rec0 = (doc.records || []).find(function(r){ return r.capacity === lrCap; })
              || (doc.records || [])[0] || {};
    document.getElementById('lr-cond').innerHTML =
      '<div><strong style="color:var(--tx)">取得条件</strong>（' + latest + ' 時点・記録された値）</div>'
      + '<div>エリア: ' + (areaLines || '-') + '</div>'
      + '<div>粒度: ' + (cond.area_level || '-')
      + '／並び順: ' + (cond.sort_order || '-')
      + '／広告枠: ' + (cond.exclude_ads ? '除外' : '含む')
      + '／宿泊日ルール: ' + (cond.target_date_rule || '-')
      + '／ブラウザ: ' + (cond.browser_state || '-') + '</div>'
      + '<div>対象宿泊日: ' + (rec0.target_date || '-')
      + '／人数: 大人' + (lrCap != null ? lrCap : (rec0.capacity != null ? rec0.capacity : '-')) + '名'
      + '／取得: ' + (doc.fetched_at || '-') + '</div>'
      + '<div style="margin-top:4px">※ OTAごとにエリアの広さが違うため、順位を横並びで比較しないこと</div>'
      + ((lrData().months || []).some(lrIsRef)
          ? '<div style="color:var(--wn)">※ 参考値の月は取得条件が違います。境目をまたいだ比較はできません</div>'
            + (function(){
                const notes = [];
                (lrData().months || []).forEach(function(m){
                  const n = lrRefNote(m);
                  if (n && notes.indexOf(n) < 0) notes.push(n);
                });
                return notes.map(function(n){
                  return '<div style="color:var(--wn)">参考値の条件: ' + n + '</div>'; }).join('');
              })()
          : '');
  }

  drawListingCharts();
  drawListingTop();
}

// ── OTAごとの順位推移（1枚につきPC・モバイルの2本だけ） ──
function drawListingCharts() {
  const months = lrYearMonths(), media = lrMedia();
  const otas = [];
  media.forEach(function(c) { if (otas.indexOf(c.ota) < 0) otas.push(c.ota); });

  const wrap = document.getElementById('lr-charts');
  wrap.innerHTML = otas.map(function(o) {
    return '<div class="chart-box">'
      + '<div class="chart-title" style="color:' + (LR_OTA_COLOR[o] || 'var(--tx)') + '">'
      + (LR_OTA_NAME[o] || o) + ' の順位推移</div>'
      + '<div id="lr-box-' + o + '"><canvas id="c-lr-' + o + '" height="110"></canvas></div>'
      + '</div>';
  }).join('');

  otas.forEach(function(o) {
    const devs = media.filter(function(c){ return c.ota === o; });
    const datasets = devs.map(function(c) {
      const col = LR_OTA_COLOR[o] || '#9E9E9E';
      const data = months.map(function(m) {
        const r = lrFind(m, c.ota, c.device, lrCap);
        // status が ok 以外は null。0で埋めない・前月値で埋めない
        return (r && r.status === 'ok' && r.rank != null) ? r.rank : null;
      });
      return {
        label: lrDevLabel(c.device),
        data: data, borderColor: col, backgroundColor: col,
        borderDash: c.device === 'mobile' ? [5,3] : [],
        borderWidth: 2, pointRadius: 3, tension: 0.2, spanGaps: false,
        pointBackgroundColor: months.map(function(m){ return lrIsRef(m) ? lrTint(col) : col; }),
        segment: {
          borderDash: function(ctx) {
            if (lrIsRef(months[ctx.p0DataIndex]) || lrIsRef(months[ctx.p1DataIndex])) return [2,2];
            return c.device === 'mobile' ? [5,3] : undefined;
          },
          borderColor: function(ctx) {
            if (lrIsRef(months[ctx.p0DataIndex]) || lrIsRef(months[ctx.p1DataIndex])) return lrTint(col);
            return col;
          }
        }
      };
    });
    const vals = datasets.reduce(function(a,d){ return a.concat(d.data); }, [])
                         .filter(function(v){ return v != null; });
    if (!vals.length) {
      document.getElementById('lr-box-' + o).innerHTML =
        '<div class="empty-msg" style="padding:14px">'
        + (months.length ? lrYear + '年は未取得です'
                         : '未取得（このOTAの掲載順位はまだ収集していません）') + '</div>';
      return;
    }
    mk('c-lr-' + o, {
      type: 'line',
      data: { labels: months, datasets: datasets },
      plugins: [lrBoundaryPlugin(months)],
      options: Object.assign({}, base, {
        plugins: {
          legend: { display:true, labels:{ color:'#7a7f8e', font:{ size:10 }, boxWidth:18 } },
          tooltip: Object.assign({}, base.plugins.tooltip, {
            callbacks: { label: function(ctx) {
              const c = devs[ctx.datasetIndex], m = months[ctx.dataIndex];
              const r = lrFind(m, c.ota, c.device, lrCap);
              return lrDevLabel(c.device) + ': ' + (r ? lrPos(r) : '未取得')
                   + (lrIsRef(m) ? '（参考値）' : '');
            } }
          })
        },
        scales: {
          x: base.scales.x,
          y: { reverse:true, min:1, suggestedMax: Math.max.apply(null, vals) + 1,
               grid: base.scales.y.grid,
               ticks: Object.assign({}, base.scales.y.ticks,
                      { precision:0, callback:function(v){ return v + '位'; } }) }
        }
      })
    });
  });
}

// ── 上位10施設の推移（競合名入りの一覧表） ──
// 行＝1〜10位、列＝月、セル＝その順位にいた施設名。自社のセルだけ色を変える。
// 順位の入れ替わりを、名前で目で追えるようにするための表。
function drawListingTop() {
  // ここだけ年で絞らない。12月→1月のような年をまたぐ入れ替わりを
  // 連続して追いたいため、全期間を横に並べる
  const months = lrData().months || [], media = lrMedia();
  const tbl = document.getElementById('t-listing-top');
  const note = document.getElementById('lr-top-note');

  // 媒体の選択ボタン
  if (!lrPickedMedium && media.length) {
    lrPickedMedium = media[0].ota + '|' + media[0].device;
  }
  const tabs = document.getElementById('lr-top-tabs');
  tabs.innerHTML = media.map(function(c) {
    const key = c.ota + '|' + c.device;
    return '<button class="metric-btn' + (lrPickedMedium === key ? ' active' : '')
      + '" data-lrtop="' + key + '">' + (LR_OTA_NAME[c.ota] || c.ota)
      + ' ' + lrDevLabel(c.device) + '</button>';
  }).join('');
  tabs.querySelectorAll('[data-lrtop]').forEach(function(b) {
    b.onclick = function() { lrPickedMedium = this.dataset.lrtop; drawListingTop(); };
  });

  if (!lrPickedMedium) { tbl.innerHTML = ''; note.innerHTML = ''; return; }
  const ota = lrPickedMedium.split('|')[0], device = lrPickedMedium.split('|')[1];

  // 上位一覧を持つ月だけが列になる（手作業の月には上位一覧が無い）
  const cols = months.filter(function(m) {
    const r = lrFind(m, ota, device, lrCap);
    return r && r.top_listings && r.top_listings.length;
  });
  if (!cols.length) {
    tbl.innerHTML = '<tr><td class="empty-msg">'
      + (LR_OTA_NAME[ota] || ota) + ' ' + lrDevLabel(device)
      + ' は上位一覧が未取得です</td></tr>';
    note.innerHTML = '';
    return;
  }

  let h = '<tr><th style="text-align:left;white-space:nowrap">順位</th>';
  cols.forEach(function(m) {
    h += '<th style="white-space:nowrap">' + m
       + (lrIsRef(m) ? '<br><span style="font-size:9px;color:var(--wn)">参考値</span>' : '') + '</th>';
  });
  h += '</tr>';

  for (let rank = 1; rank <= 10; rank++) {
    h += '<tr><td style="white-space:nowrap;color:var(--mu)">' + rank + '位</td>';
    cols.forEach(function(m) {
      const r = lrFind(m, ota, device, lrCap);
      const hit = (r.top_listings || []).find(function(t){ return t.rank === rank; });
      if (!hit) { h += '<td style="color:var(--mu)">-</td>'; return; }
      const ownId = lrOwnId(m, ota, device, lrCap);
      const isOwn = ownId != null && (hit.listing_id || hit.facility) === ownId;
      h += '<td style="white-space:nowrap;'
         + (isOwn ? 'background:rgba(139,105,20,0.16);color:var(--ac);font-weight:700' : '')
         + '">' + String(hit.facility || '').slice(0, 26) + '</td>';
    });
    h += '</tr>';
  }
  tbl.innerHTML = h;

  note.innerHTML = '<div>行＝順位、列＝月。セルはその月その順位にいた施設です。'
    + '<span style="background:rgba(139,105,20,0.16);color:var(--ac);font-weight:700;padding:0 4px">色付き</span> が自社です</div>'
    + (months.length > cols.length
        ? '<div style="color:var(--wn)">※ 上位一覧が無い月（手作業の記録）は列に出せません</div>'
        : '');
}

// ======================= 売上ランキング =======================
// 掲載順位タブと同じ「行=月・列=媒体」の表で出す。順位は母数と対でしか
// 意味が定まらない（126宿中8位と39,912宿中8位は別の情報）ので、
// セルは必ず「8位 / 126宿」の形にする。掲載順位の lrPos() と同じ考え方。
//
// 色は掲載順位（LR_OTA_COLOR）と揃える。2つのタブで同じOTAが違う色だと、
// タブを行き来したときに読み違える
const SR_OTA_NAME  = { jalan:'じゃらん', rakuten:'楽天', ikyu_yahoo:'一休・Yahoo!' };
const SR_OTA_COLOR = { jalan:'#FF9800', rakuten:'#BF3131', ikyu_yahoo:'#2196F3' };
const SR_STATUS_LABEL = {
  ok:'取得', not_available:'表示なし', fetch_failed:'取得失敗'
};

// 表1の列。path はレコードからの取り出し口（{rank, total} を指す）
const SR_RANK_COLS = [
  { ota:'jalan',      label:'全宿内・エリア内', path:['all_area'] },
  { ota:'jalan',      label:'宿種別・エリア内', path:['type_area'] },
  { ota:'rakuten',    label:'金額・地区',       path:['amount','area'] },
  { ota:'ikyu_yahoo', label:'金額・地域',       path:['amount','area'] },
  { ota:'ikyu_yahoo', label:'室数・地域',       path:['rooms','area'] }
];

// 表2の列。地区シェアと、その分子・分母。
// share だけ path を持たない（2つの生値から描画時に計算する派生値）。
//
// 一休・Yahoo! の実績金額／実績室数は 2026-08-16 に表示から外した。
// **JSONの amount.actual_yen / rooms.actual は保持している**（取得済みの
// データは消さない）。一休の順位そのものは表1の「金額・地域」「室数・地域」に
// 残っているので、消えたのは実数だけ。
// 表2は結果として楽天だけの表になる。
const SR_ACTUAL_COLS = [
  { ota:'rakuten',    label:'実績泊数', unit:'泊', path:['nights','actual'] },
  { ota:'rakuten',    label:'地区泊数', unit:'泊', path:['market','area_nights'] },
  { ota:'rakuten',    label:'地区シェア', unit:'%', share:true }
];

let srYear = null;            // 表示中の年。2つの表に共通で効く

function srData() { return DATA.sales_rank || { months:[], by_month:{}, otas:[] }; }
function srDoc(month) { return (srData().by_month || {})[month] || {}; }
function srRecords(month) { return srDoc(month).records || []; }
function srMonths() { return srData().months || []; }
// 列に出すOTA。config ∪ データ（payload 側で作ってある）。
// 収集対象にしていないOTAの列は出さない（掲載順位が config から媒体の列を
// 作っているのと同じ）
function srOtas() { return (srData().otas || []); }
function srFind(month, ota) {
  return srRecords(month).find(function(x){ return x.ota === ota; }) || null;
}
// レコードから入れ子の値を取り出す。途中が無ければ null
function srDig(rec, path) {
  let node = rec;
  for (let i = 0; i < path.length; i++) {
    if (node == null || typeof node !== 'object') return null;
    node = node[path[i]];
  }
  return node === undefined ? null : node;
}
// 分母が推定値か（スプシ由来の area_total は年度固定の推定値）
function srEstimated(node) { return !!(node && node.total_is_estimated); }
// じゃらんの予約ベース月（算出日以降4ヶ月）。実績確定時に値が変わる
function srIsBooking(month) {
  const r = srFind(month, 'jalan');
  return !!(r && r.basis === 'booking');
}
function srNum(n) { return (n == null) ? '-' : Number(n).toLocaleString(); }

// ■ srPct は表では使わない（呼び出しを外してある）
//   上位%（rank/total*100）は折れ線で3OTAを同じ土俵に載せるための派生値で、
//   月×媒体の表では母数がセルに併記されるので要らない。式そのものは
//   捨てずに残す（表に戻したくなったときに作り直さないため）。
//   分母が推定値のときに null を返す約束もそのまま。
function srPct(node) {
  if (!node || node.rank == null || !node.total) return null;
  if (srEstimated(node)) return null;
  return node.rank / node.total * 100;
}

// セルの表記。掲載順位の lrPos() と同じで、順位だけを裸で出さない。
// 母数が推定値なら ≈ を付けて実測と見分けられるようにする
function srPos(rec, node) {
  if (!node || node.rank == null) {
    if (rec && rec.status && rec.status !== 'ok') {
      return SR_STATUS_LABEL[rec.status] || rec.status;
    }
    return null;                       // 呼び出し側が「未取得」を出す
  }
  if (!node.total) return srNum(node.rank) + '位';
  return srNum(node.rank) + '位 / ' + (srEstimated(node) ? '≈' : '') + srNum(node.total) + '宿';
}

// データがある年だけを返す（無い年のボタンは出さない。押しても空なので）
function srYears() {
  const ys = [];
  srMonths().forEach(function(m) {
    const y = m.slice(0, 4);
    if (ys.indexOf(y) < 0) ys.push(y);
  });
  return ys.sort();
}
function srYearMonths() {
  return srMonths().filter(function(m){ return m.slice(0, 4) === srYear; });
}
// 年切替のボタン。2箇所に置くが状態は1つなので、押すと両方の表が動く
function srYearTabs(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = srYears().map(function(y) {
    return '<button class="metric-btn' + (srYear === y ? ' active' : '')
      + '" data-sryear="' + y + '">' + y + '年</button>'; }).join('');
  el.querySelectorAll('[data-sryear]').forEach(function(b) {
    b.onclick = function() { srYear = this.dataset.sryear; drawSalesRank(); };
  });
}

// 2つの表に共通の2段ヘッダー（上段=OTA名を色付き／下段=指標名）。
// 掲載順位の「OTA名 + <br> + 小さいデバイス名」と同じ組み方
function srHead(cols) {
  let h = '<tr><th style="text-align:left;white-space:nowrap">月</th>';
  cols.forEach(function(c) {
    h += '<th style="white-space:nowrap;color:' + (SR_OTA_COLOR[c.ota] || 'var(--mu)') + '">'
       + (SR_OTA_NAME[c.ota] || c.ota)
       + '<br><span style="font-size:9px;font-weight:400">' + c.label + '</span></th>';
  });
  return h + '</tr>';
}

// 月セル。掲載順位の「参考値（手作業）」と同じ位置・同じスタイルで
// 補助ラベルを付ける。
//
// ラベルを出すのは表1（順位）だけ。「予約ベース」はじゃらんの順位が
// 見込みであることの断りで、表2に並ぶ一休の実績金額や楽天の実績泊数には
// かからない。両方に出すと、確定している実績まで見込みだと読まれる
function srMonthCell(m, withLabel) {
  return '<tr><td style="white-space:nowrap">' + m
    + ((withLabel && srIsBooking(m))
        ? '<br><span style="font-size:9px;color:var(--wn)"'
          + ' title="じゃらんの予約ベース。実績確定時に値が変わります">予約ベース</span>'
        : '')
    + '</td>';
}

function drawSalesRank() {
  const tbl = document.getElementById('t-sales-rank');
  if (!tbl) return;                    // 売上ランキングタブ自体を出していない施設

  // 年の既定は「データがある最後の年」（掲載順位と同じ）
  const years = srYears();
  if (years.length && years.indexOf(srYear) < 0) srYear = years[years.length - 1];
  srYearTabs('sr-year-tabs');
  srYearTabs('sr-year-tabs2');

  const otas = srOtas();
  const months = srYearMonths();
  const rankCols   = SR_RANK_COLS.filter(function(c){ return otas.indexOf(c.ota) >= 0; });
  const actualCols = SR_ACTUAL_COLS.filter(function(c){ return otas.indexOf(c.ota) >= 0; });

  if (!rankCols.length) {
    tbl.innerHTML = '<tr><td class="empty-msg">売上ランキングは未収集です'
      + '（--facility を指定して生成してください）</td></tr>';
    document.getElementById('t-sales-actual').innerHTML = '';
    document.getElementById('sr-cond').innerHTML = '';
    return;
  }

  // ── 表1: 売上ランキング 一覧 ──
  let h = srHead(rankCols);
  if (!months.length) {
    h += '<tr><td class="empty-msg" colspan="' + (rankCols.length + 1) + '">'
       + (srYear ? srYear + '年のデータはありません' : 'データなし') + '</td></tr>';
  }
  // 新しい月が上（掲載順位と同じ並び）
  months.slice().reverse().forEach(function(m) {
    h += srMonthCell(m, true);
    rankCols.forEach(function(c) {
      const rec = srFind(m, c.ota);
      const txt = rec ? srPos(rec, srDig(rec, c.path)) : null;
      if (txt == null) { h += '<td style="text-align:center;color:var(--mu)">未取得</td>'; return; }
      h += '<td style="text-align:center;white-space:nowrap;color:'
         + (rec.status === 'ok' ? 'var(--tx)' : 'var(--mu)') + '">' + txt + '</td>';
    });
    h += '</tr>';
  });
  tbl.innerHTML = h;

  drawSalesActual(actualCols, months);
  drawSalesCond(rankCols);
}

// ── 表2: 実績・シェア 一覧（順位の分子と、そこから作る地区シェア） ──
function drawSalesActual(cols, months) {
  const tbl = document.getElementById('t-sales-actual');
  // 表2は楽天だけの表。楽天を収集していない施設では列が1つも立たないので、
  // 見出しと空の表だけが残る「壊れて見える箱」にしないよう理由を出す。
  // 地区のマーケット規模（分母）を開示しているのは楽天だけで、
  // じゃらん・一休の管理画面からはシェアを作れない
  if (!cols.length) {
    tbl.innerHTML = '<tr><td class="empty-msg">'
      + 'この施設は楽天トラベルを収集対象にしていないため、実績泊数と地区シェアは出せません'
      + '（地区の実績泊数を開示しているのは楽天だけです）</td></tr>';
    return;
  }

  let h = srHead(cols);
  if (!months.length) {
    h += '<tr><td class="empty-msg" colspan="' + (cols.length + 1) + '">'
       + (srYear ? srYear + '年のデータはありません' : 'データなし') + '</td></tr>';
  }
  months.slice().reverse().forEach(function(m) {
    h += srMonthCell(m, false);
    cols.forEach(function(c) {
      const rec = srFind(m, c.ota);
      let txt = null;
      if (rec) {
        if (c.share) {
          // 地区シェア＝自社の実績泊数 / 地区の実績泊数。JSONには保存しない
          const own = srDig(rec, ['nights','actual']);
          const mkt = srDig(rec, ['market','area_nights']);
          if (own != null && mkt) txt = (own / mkt * 100).toFixed(2) + '%';
        } else {
          const v = srDig(rec, c.path);
          if (v != null) txt = srNum(v) + c.unit;
        }
      }
      if (txt == null) { h += '<td style="text-align:center;color:var(--mu)">未取得</td>'; return; }
      h += '<td style="text-align:center;white-space:nowrap">' + txt + '</td>';
    });
    h += '</tr>';
  });
  tbl.innerHTML = h;
}

// ── 取得元（掲載順位の「取得条件」と同じ位置・同じスタイル） ──
function drawSalesCond(rankCols) {
  const el = document.getElementById('sr-cond');
  if (!el) return;
  const otas = [];
  rankCols.forEach(function(c){ if (otas.indexOf(c.ota) < 0) otas.push(c.ota); });

  // 出典の書き方はOTAごとに違う（画面のどのメニューの、どの順位か）。
  // 列に出しているOTAの分だけ書く。収集していないOTAの説明を並べると
  // 「取っているのに出ていない」と読めてしまう
  const SRC = {
    jalan:      'じゃらん＝売上ランキング／全宿内順位・エリア内',
    rakuten:    '楽天＝総合ランキング／金額・地区',
    ikyu_yahoo: '一休・Yahoo!＝販売実績順位／金額・地域順位（一休とYahoo!の合算）'
  };
  // じゃらんの算出日。ここから4ヶ月が予約ベースなので、記録された実物を出す
  let calc = null;
  srMonths().slice().reverse().some(function(m) {
    const r = srFind(m, 'jalan');
    if (r && r.calculated_at) { calc = r.calculated_at; return true; }
    return false;
  });
  // 全期間で見る（選択中の年に無くても、注記自体は出す必要がある）
  const anyBooking = srMonths().some(srIsBooking);
  const anyEstimated = srMonths().some(function(m) {
    return SR_RANK_COLS.some(function(c) {
      const rec = srFind(m, c.ota);
      return rec && srEstimated(srDig(rec, c.path));
    });
  });

  el.innerHTML =
    '<div><strong style="color:var(--tx)">取得元</strong></div>'
    + otas.map(function(o){ return '<div>' + (SRC[o] || o) + '</div>'; }).join('')
    + '<div>取得方法: 管理画面のスクリーンショットから目視転記</div>'
    + (calc ? '<div>じゃらん算出日: ' + calc + '</div>' : '')
    + (otas.length > 1
        ? '<div style="margin-top:4px">※ OTAごとに母集団の広さが違うため、'
          + '順位を横並びで比較しないこと</div>'
        : '<div style="margin-top:4px"></div>')
    + '<div>※ 当月は月途中の値のため掲載していません</div>'
    + (anyBooking
        ? '<div style="color:var(--wn)">※「予約ベース」の月は実績確定時に値が変わります</div>'
        : '')
    + (anyEstimated
        ? '<div style="color:var(--wn)">※ 楽天の ≈ が付いた母数は年度固定の推定値です'
          + '（スプレッドシートからの移行分）</div>'
        : '');
}


</script>
